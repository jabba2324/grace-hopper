name: grace-hopper

services:
  code-server:
    image: grace-hopper
    command: ["/app/scripts/code_server.sh"]
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    environment:
      - CODE_SERVER_PASSWORD=${CODE_SERVER_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GH_TOKEN}
      # VS Code strips GITHUB_TOKEN from the extension host (security policy).
      # GH_TOKEN carries the same value under a name that isn't filtered.
      - GH_TOKEN=${GH_TOKEN}
      - GH_USERNAME=${GH_USERNAME}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-mail@chrissewell.net}
    volumes:
      - ./workspaces:/workspaces
      - ./state:/app/state
      - ./claude-home:/home/agent/.claude
      - ./claude-home/.claude.json:/home/agent/.claude.json
    restart: unless-stopped

  agent:
    build: .
    image: grace-hopper
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Managed Agents — created once via scripts/setup_agent.py
      - ANTHROPIC_ENVIRONMENT_ID=${ANTHROPIC_ENVIRONMENT_ID}
      - ANTHROPIC_ENVIRONMENT_KEY=${ANTHROPIC_ENVIRONMENT_KEY}
      - AGENT_ID=${AGENT_ID}
      # Model baked into the agent at creation time (see setup_agent.py).
      # Change here only takes effect when the agent is recreated.
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-opus-4-8}
      # Ponytail lazy-dev mode: lite | full | ultra | off
      - PONYTAIL_DEFAULT_MODE=${PONYTAIL_DEFAULT_MODE:-full}
      - GITHUB_TOKEN=${GH_TOKEN}
      - GH_TOKEN=${GH_TOKEN}
      - GH_USERNAME=${GH_USERNAME}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      # Optional: default git author identity
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Agent}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-mail@chrissewell.net}
    volumes:
      - ./workspaces:/workspaces
      - ./state:/app/state
      - ./claude-home:/home/agent/.claude
      - ./claude-home/.claude.json:/home/agent/.claude.json
    restart: unless-stopped
    # Allow git operations and subprocess spawning
    security_opt:
      - no-new-privileges:false
